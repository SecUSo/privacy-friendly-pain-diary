pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    versionCatalogs {
        create("libs") {
            from(files("libs/pfa-core/libs.versions.toml"))
        }
    }
}

include ':app'

include ':model'
project(':model').projectDir = new File(rootDir, 'libs/pfa-core/model')

include ':ui-view'
project(':ui-view').projectDir = new File(rootDir, 'libs/pfa-core/ui-view')

include ':backup-api'
project(':backup-api').projectDir = new File(rootDir, 'libs/pfa-core/libs/privacy-friendly-backup-api/BackupAPI')
