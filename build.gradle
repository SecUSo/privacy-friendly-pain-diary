// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    alias libs.plugins.android.app apply false
    alias libs.plugins.android.lib apply false
    alias libs.plugins.kotlin.android apply false
    alias libs.plugins.ksp apply false
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }

    // The PFA-Core ui-view module depends on the model module via the external
    // coordinate "org.secuso.pfacore:model". Substitute it with the local project.
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module("org.secuso.pfacore:model") using project(":model")
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
