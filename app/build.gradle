plugins {
    alias libs.plugins.android.app
    alias libs.plugins.kotlin.android
    alias libs.plugins.ksp
}

android {
    namespace "org.secuso.privacyfriendlypaindiary"
    defaultConfig {
        applicationId "org.secuso.privacyfriendlypaindiary"
        minSdkVersion 21
        targetSdkVersion 34
        compileSdk 34
        versionCode 100
        versionName "1.3.4"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'org.secuso.privacyfriendlypaindiary'
    lint {
        lintConfig = file("lint.xml")
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    kotlin {
        jvmToolchain(17)
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.all {
            def appName = "pfa-pain-diary"
            outputFileName = appName + "-${variant.name}-v${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    coreLibraryDesugaring libs.desugar.jdk
    testImplementation libs.junit
    androidTestImplementation libs.junit
    androidTestImplementation(libs.ax.test.junit) {
        exclude group: 'com.android.support', module: 'support-annotations'
    }
    androidTestImplementation('androidx.test:runner:1.5.2')
    androidTestImplementation('androidx.test:core:1.5.0')
    implementation libs.ax.appcompat
    implementation libs.ax.legacy.v4
    implementation libs.material
    implementation 'com.prolificinteractive:material-calendarview:1.4.3'
    implementation("com.github.bumptech.glide:glide:4.11.0") {
        exclude group: "com.android.support"
    }
    ksp 'com.github.bumptech.glide:compiler:4.9.0'

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"

    implementation libs.ax.room
    annotationProcessor libs.ax.room.compiler
    ksp libs.ax.room.compiler
    implementation libs.ax.room.ktx

    // pfa-core library
    implementation project(path: ':model')
    implementation project(path: ':ui-view')

    implementation project(path: ':backup-api')
    def work_version = "2.9.0"
    implementation "androidx.work:work-runtime:$work_version"
    implementation "androidx.work:work-runtime-ktx:$work_version"
    androidTestImplementation "androidx.work:work-testing:$work_version"
}
repositories {
    mavenCentral()
}
